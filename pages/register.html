<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForestMap - Register</title>

    <link rel="icon" href="../assets/imgs/logo-forestMap.png" type="image/png">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header>
        <div class="header-container">
            <a href="../index.html" class="logo">
                Forest<span>MAP</span>
            </a>
        </div>
    </header>

    <main>
        <div class="container">
            <form action="">
                <h1>Create Account</h1>

                <div class="form">
                    <input
                        type="text"
                        placeholder="Username"
                        name="username"
                        autocomplete="off"
                    >
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="form">
                    <input
                        type="email"
                        placeholder="Email"
                        name="email"
                        autocomplete="email"
                    >
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div class="form">
                    <input
                        type="password"
                        placeholder="Password"
                        name="password"
                        id="password"
                    >
                    <i
                        class="fa-solid fa-eye password-toggle"
                        id="togglePassword"
                    ></i>
                </div>

                <div class="form">
                    <input
                        type="password"
                        placeholder="Confirm Password"
                        name="confirm-password"
                        id="confirmPassword"
                    >
                    <i
                        class="fa-solid fa-eye password-toggle"
                        id="toggleConfirmPassword"
                    ></i>
                </div>

                <button type="submit">Create Account</button>

                <div class="register">
                    <p>Already have an account?</p>
                    <a href="./login.html">Login</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <h3>ForestMap</h3>
                <p>
                    Find the best opportunities and connect with top employers
                    worldwide.
                </p>
            </div>

            <div class="footer-links">
                <h4>Quick Links</h4>
                <a href="../home.html">Home</a>
                <a href="#">Jobs</a>
                <a href="#">Companies</a>
                <a href="#">Contact</a>
            </div>

            <div class="footer-contact">
                <h4>Contact</h4>
                <p><i class="fa-solid fa-phone"></i> +84 123 456 789</p>
                <p><i class="fa-solid fa-envelope"></i> contact@forestmap.com</p>
                <p><i class="fa-solid fa-location-dot"></i> Ho Chi Minh City</p>
            </div>
        </div>

        <div class="footer-bottom">
            <div class="social">
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>

            <p>© 2026 ForestMap. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/auth.js"></script>
</body>
</html>
